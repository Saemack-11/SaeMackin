name: SHIN
options:
  bundleIdPrefix: com.saeway
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

targets:
  SHIN:
    type: application
    platform: iOS
    sources:
      - path: ios-keyboard/SHINHostApp.swift
      - path: ios-keyboard/SharedConfig.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saeway.shin
        CODE_SIGN_ENTITLEMENTS: ios-keyboard/SHINHost.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SHIN
    dependencies:
      - target: SHINKeyboard
        embed: true

  SHINKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: ios-keyboard/KeyboardViewController.swift
      - path: ios-keyboard/SharedConfig.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saeway.shin.keyboard
        CODE_SIGN_ENTITLEMENTS: ios-keyboard/SHINKeyboard.entitlements
        INFOPLIST_FILE: ios-keyboard/SHINKeyboard-Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
